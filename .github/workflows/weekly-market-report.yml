name: Weekly US Market Report

on:
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test-Modus (keine Orders): 1 = Test, 0 = Live, leer = automatisch (nur samstags Live)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install "yfinance>=0.2.54" "numpy<2.0"

      - name: Syntax-Check (bricht sofort ab statt nach dem Scan)
        run: |
          python -m compileall -q .

      - name: Restore Yahoo-Wochenkerzen-Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: weekly-ohlcv-${{ github.run_id }}
          restore-keys: |
            weekly-ohlcv-

      - name: Export secrets to env
        run: |
          echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> $GITHUB_ENV
          echo "MAIL_TO=${{ secrets.MAIL_TO }}" >> $GITHUB_ENV
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> $GITHUB_ENV
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> $GITHUB_ENV
          echo "UNIVERSE=${{ vars.UNIVERSE }}" >> $GITHUB_ENV
          echo "CUSTOM_TICKERS=${{ vars.CUSTOM_TICKERS }}" >> $GITHUB_ENV
          echo "LOOKBACK_WEEKS=${{ vars.LOOKBACK_WEEKS }}" >> $GITHUB_ENV
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> $GITHUB_ENV
          echo "ALPACA_API_SECRET=${{ secrets.ALPACA_API_SECRET }}" >> $GITHUB_ENV
          echo "TEST_MODE=${{ github.event.inputs.test_mode }}" >> $GITHUB_ENV

      - name: Run report
        run: |
          python main.py

      - name: Run Launchpad Diagnostic
        run: |
          python launchpad_diagnostic.py
        continue-on-error: true

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "report: update $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push abgelehnt (Versuch $i) — hole und rebase auf origin/main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase fehlgeschlagen"; git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
