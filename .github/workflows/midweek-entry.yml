name: Mid-Week Entry

# Mittwochs kurz vor Handelsschluss: 19:30 UTC = 15:30 ET.
# Frueher am Tag ist das Tagesvolumen zu klein, um einen Volumenausbruch zu
# bestaetigen — siehe Kopfkommentar in midweek_entry.py.
on:
  schedule:
    - cron: '30 19 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur pruefen, keine Orders (1 = dry-run)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  midweek-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install "yfinance>=0.2.54" "numpy<2.0"

      - name: Export secrets to env
        run: |
          echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> $GITHUB_ENV
          echo "MAIL_TO=${{ secrets.MAIL_TO }}" >> $GITHUB_ENV
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> $GITHUB_ENV
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> $GITHUB_ENV
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> $GITHUB_ENV
          echo "ALPACA_API_SECRET=${{ secrets.ALPACA_API_SECRET }}" >> $GITHUB_ENV

      # Kein TEST_MODE aus der Wochentagsautomatik: die schaltet ausserhalb des
      # Samstags auf Test und wuerde den Mittwochslauf still wirkungslos machen.
      # Der Schalter ist hier explizit und heisst --dry-run.
      - name: Mid-Week Entry
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            python midweek_entry.py --dry-run
          else
            python midweek_entry.py
          fi
