name: Journal reparieren (unknown-Exits)

# Rekonstruiert historische position_closed_unknown-Eintraege aus den echten
# Alpaca-Fills. Default: Dry-Run (Vorschau im Log, keine Aenderung). Mit
# apply=true wird trades.json + trades.html geschrieben und committet.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = trades.json schreiben & committen, false = nur Vorschau'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Export secrets to env
        run: |
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> $GITHUB_ENV
          echo "ALPACA_API_SECRET=${{ secrets.ALPACA_API_SECRET }}" >> $GITHUB_ENV

      - name: Run repair_journal.py
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python repair_journal.py --apply
          else
            python repair_journal.py
          fi

      - name: Commit & push (nur bei apply)
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/trades.json docs/trades.html
          git diff --cached --quiet || git commit -m "fix: historische unknown-Exits aus echten Fills rekonstruiert [$(date '+%Y-%m-%d')]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push abgelehnt (Versuch $i) — hole und rebase auf origin/main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase fehlgeschlagen"; git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
