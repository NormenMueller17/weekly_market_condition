name: Orders diagnostizieren

# Liest NUR — fragt Alpaca-Orders der angegebenen Symbole ab und druckt sie ins Log.
# Aendert weder trades.json noch platziert es Orders. Fuer die Analyse von
# exit_reason=position_closed_unknown.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Symbole (Leerzeichen-getrennt). Leer = alle unknown-Symbole aus trades.json'
        required: false
        default: 'ON STX VSH GLW NUE TTMI SANM'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Export secrets to env
        run: |
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> $GITHUB_ENV
          echo "ALPACA_API_SECRET=${{ secrets.ALPACA_API_SECRET }}" >> $GITHUB_ENV

      - name: Run diagnose_orders.py
        run: |
          python diagnose_orders.py ${{ github.event.inputs.symbols }}
