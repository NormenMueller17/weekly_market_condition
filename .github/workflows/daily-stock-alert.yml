name: Depot-Alert (täglich Mo–Fr)

# 15:00 UTC = 11:00 EDT / 10:00 EST — in BEIDEN Zeitzonen sicher innerhalb der
# US-Handelszeit. Das ist wichtig, weil hier Teilverkaeufe als Market-Order
# laufen; bei geschlossenem Markt lehnt Alpaca sie ab (genau der Wochenend-Bug,
# wegen dem es --monday-execute gibt). Dieselbe Uhrzeit nutzt monday-execute.
#
# Frueh am Tag statt kurz vor Schluss, damit eine Position ohne Stop-Order nicht
# den ganzen Handelstag ungeschuetzt bleibt.
on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur pruefen, keine Aenderungen (1 = dry-run)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install "yfinance>=0.2.54" "numpy<2.0"

      - name: Export secrets to env
        run: |
          echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> $GITHUB_ENV
          echo "MAIL_TO=${{ secrets.MAIL_TO }}" >> $GITHUB_ENV
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> $GITHUB_ENV
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> $GITHUB_ENV
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> $GITHUB_ENV
          echo "ALPACA_API_SECRET=${{ secrets.ALPACA_API_SECRET }}" >> $GITHUB_ENV

      # Kein TEST_MODE aus der Wochentagsautomatik — die schaltet ausserhalb des
      # Samstags auf Test und wuerde den Lauf still wirkungslos machen.
      - name: Depot-Alert
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            python daily_stock_alert.py --dry-run
          else
            python daily_stock_alert.py
          fi

      - name: Commit aktualisiertes Journal
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/trades.json
          git diff --staged --quiet || git commit -m "journal: Depot-Alert $(date +%Y-%m-%d)"
          git push
