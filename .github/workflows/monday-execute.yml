name: Monday Execute (Pending Orders)

# Kein schedule:-Trigger mehr: GitHub Actions' eigener Cron lief bei diesem
# Repo durchgehend 4-9h zu spaet (siehe Memory project_github_actions_
# scheduling_delay). Ausloesung jetzt per Cloudflare Worker
# (cloudflare-worker/github-scheduler/) ueber workflow_dispatch zur exakten
# Zielzeit (ehemals Montag + Dienstag 15:00 UTC, Dienstag als Fallback bei
# Feiertag-Montag — beide Zeitpunkte stehen weiterhin in der Worker-Zeit-
# Tabelle).
on:
  workflow_dispatch:

concurrency:
  group: repo-git-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monday-execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prüfe ob Pending-Dateien existieren
        id: check
        run: |
          if [ -f "docs/data/pending_orders.json" ] || [ -f "docs/data/pending_profit_taking.json" ] || [ -f "docs/data/pending_takeover_sells.json" ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
            echo "Pending orders und/oder Profit-Taking gefunden."
          else
            echo "has_pending=false" >> $GITHUB_OUTPUT
            echo "Keine Pending-Dateien — nichts zu tun."
          fi

      - name: Set up Python
        if: steps.check.outputs.has_pending == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.check.outputs.has_pending == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install "yfinance>=0.2.54" "numpy<2.0"

      - name: Export secrets to env
        if: steps.check.outputs.has_pending == 'true'
        run: |
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> $GITHUB_ENV
          echo "ALPACA_API_SECRET=${{ secrets.ALPACA_API_SECRET }}" >> $GITHUB_ENV
          echo "TEST_MODE=0" >> $GITHUB_ENV

      - name: Execute pending orders
        if: steps.check.outputs.has_pending == 'true'
        run: |
          python main.py --monday-execute

      - name: Commit (Pending-Dateien + Journal nach Erfolg)
        if: steps.check.outputs.has_pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/trades.html
          git diff --staged --quiet || git commit -m "orders: Monday execute $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push abgelehnt (Versuch $i) — hole und rebase auf origin/main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase fehlgeschlagen"; git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
